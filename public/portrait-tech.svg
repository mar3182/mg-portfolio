<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a7cc4;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#1e4d7a;stop-opacity:0.3" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3a7cc4" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Background with tech tint -->
  <rect width="800" height="1000" fill="#0d0d0d"/>
  <rect width="800" height="1000" fill="url(#techGrad)"/>
  <rect width="800" height="1000" fill="url(#grid)"/>
  
  <!-- Code snippets -->
  <text x="500" y="150" font-family="SF Mono, monospace" font-size="14" fill="#3a7cc4" opacity="0.7">
    &lt;html&gt;
  </text>
  <text x="520" y="200" font-family="SF Mono, monospace" font-size="12" fill="#3a7cc4" opacity="0.5">
    height:184px;}
  </text>
  <text x="480" y="250" font-family="SF Mono, monospace" font-size="13" fill="#3a7cc4" opacity="0.6">
    class="creative"&gt;
  </text>
  <text x="500" y="350" font-family="Inter, sans-serif" font-size="28" fill="#3a7cc4" opacity="0.8" font-weight="600">
    CSS3
  </text>
  <text x="600" y="350" font-family="Inter, sans-serif" font-size="20" fill="#3a7cc4" opacity="0.5">
    HTML5
  </text>
  <text x="540" y="420" font-family="SF Mono, monospace" font-size="11" fill="#3a7cc4" opacity="0.6">
    color:#000;
  </text>
  <text x="560" y="480" font-family="SF Mono, monospace" font-size="12" fill="#3a7cc4" opacity="0.5">
    jQuery
  </text>
  
  <!-- Geometric lines -->
  <line x1="450" y1="100" x2="750" y2="100" stroke="#3a7cc4" stroke-width="1" opacity="0.3"/>
  <line x1="500" y1="500" x2="700" y2="500" stroke="#3a7cc4" stroke-width="1" opacity="0.2"/>
  <line x1="600" y1="0" x2="600" y2="600" stroke="#3a7cc4" stroke-width="1" opacity="0.15"/>
  
  <!-- Digital blocks -->
  <rect x="550" y="550" width="80" height="40" fill="#3a7cc4" opacity="0.2" rx="4"/>
  <rect x="650" y="600" width="60" height="30" fill="#3a7cc4" opacity="0.15" rx="4"/>
  <rect x="500" y="650" width="100" height="35" fill="#3a7cc4" opacity="0.1" rx="4"/>
  
  <!-- Silhouette -->
  <ellipse cx="400" cy="280" rx="140" ry="180" fill="#2a2a2a"/>
  <ellipse cx="400" cy="580" rx="200" ry="300" fill="#2a2a2a"/>
  
  <!-- Digital overlay on face -->
  <rect x="420" y="200" width="80" height="100" fill="none" stroke="#3a7cc4" stroke-width="1" opacity="0.4"/>
  <rect x="450" y="320" width="60" height="80" fill="none" stroke="#3a7cc4" stroke-width="1" opacity="0.3"/>
  
  <!-- Label -->
  <text x="500" y="950" font-family="Inter, sans-serif" font-size="28" fill="#3a7cc4" letter-spacing="0.1em">
    &lt;coder&gt;
  </text>
</svg>
