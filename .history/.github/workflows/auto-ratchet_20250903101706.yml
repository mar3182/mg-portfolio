name: Auto-Ratchet Performance Budgets

on:
  push:
    branches: [ main, master ]
  # Only auto-ratchet on direct pushes to main (merges), not PRs

jobs:
  auto-ratchet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with token for push
        uses: actions/checkout@v4
        with:
          # Use GITHUB_TOKEN to allow pushing budget updates back to main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and attempt ratcheting
        run: PERF_RATCHET=1 pnpm run build

      - name: Commit updated budgets if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if ! git diff --quiet perf-budgets.json; then
            echo "📈 Performance budgets were automatically tightened:"
            git diff perf-budgets.json
            git add perf-budgets.json
            git commit -m "chore: auto-ratchet performance budgets

          Performance improvements detected - budgets automatically tightened to prevent regressions.
          
          Generated by auto-ratchet workflow after merge to main."
            git push
          else
            echo "🔒 No budget changes needed (performance within existing thresholds)"
          fi

      - name: Summary
        run: |
          echo '### Auto-Ratchet Results' >> $GITHUB_STEP_SUMMARY
          if ! git diff --quiet HEAD~1 perf-budgets.json; then
            echo '✅ Performance budgets were automatically tightened after detecting improvements.' >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            git diff HEAD~1 perf-budgets.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo '🔒 No budget changes - performance within existing thresholds.' >> $GITHUB_STEP_SUMMARY
          fi
