name: Performance Budgets

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  perf-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Check Budgets
        run: pnpm run build

      - name: Preview Budget Changes (PR only)
        if: github.event_name == 'pull_request'
        run: |
          echo "## Performance Budget Preview" >> budget-preview.md
          echo "" >> budget-preview.md
          echo "Current performance vs budgets:" >> budget-preview.md
          echo '```' >> budget-preview.md
          PERF_RATCHET=dry pnpm run perf:budget 2>&1 | tail -n +2 >> budget-preview.md || true
          echo '```' >> budget-preview.md
          
          # Add to step summary
          cat budget-preview.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Budget Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-budget-report
          path: dist/perf-budget-report.json

      - name: Summary
        if: always()
        run: |
          echo '### Performance Budget Report' >> $GITHUB_STEP_SUMMARY
          if [ -f dist/perf-budget-report.json ]; then
            echo '\n\n\`\`\`json' >> $GITHUB_STEP_SUMMARY
            cat dist/perf-budget-report.json >> $GITHUB_STEP_SUMMARY
            echo '\n\n\`\`\`' >> $GITHUB_STEP_SUMMARY
          else
            echo 'Report missing (build may have failed before generation).' >> $GITHUB_STEP_SUMMARY
          fi